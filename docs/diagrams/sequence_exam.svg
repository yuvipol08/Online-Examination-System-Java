ans, Verdana, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111" font-style="normal">stores it in the map</text><line x1="95" y1="400" x2="500" y2="400" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/><text x="297.5" y="393" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#111" font-style="normal">clicks Submit Exam</text><line x1="500" y1="432" x2="910" y2="432" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/><text x="705.0" y="425" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#111" font-style="normal">submitExam(session, userId)</text><line x1="910" y1="464" x2="700" y2="464" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/><text x="805.0" y="457" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#111" font-style="normal">getCorrectCount(), getAnsweredCount()</text><line x1="700" y1="496" x2="910" y2="496" stroke="#222" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/><text x="805.0" y="489" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#111" font-style="italic">counts of the attempt</text><rect x="840" y="516" width="300" height="150" rx="4" fill="#FFF8E8" stroke="#333" stroke-width="1.4" stroke-dasharray="4,3"/><text x="860" y="534" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#111" font-style="normal">transaction</text><line x1="910" y1="560" x2="1100" y2="560" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/><text x="1005.0" y="553" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#111" font-style="normal">setAutoCommit(false)</text><line x1="910" y1="592" x2="1100" y2="592" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/><text x="1005.0" y="585" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#111" font-style="normal">INSERT INTO results</text><line x1="910" y1="624" x2="1100" y2="624" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/><text x="1005.0" y="617" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#111" font-style="normal">INSERT INTO answers (batch)</text><line x1="910" y1="656" x2="1100" y2="656" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/><text x="1005.0" y="649" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#111" font-style="normal">commit()  /  rollback() on error</text><line x1="910" y1="696" x2="500" y2="696" stroke="#222" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/><text x="705.0" y="689" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#111" font-style="italic">Result object</text></svg>